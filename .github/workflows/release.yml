name: EduNova 2.0 - APK Release Bertandatangan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: 1. Ambil projek
        uses: actions/checkout@v4
      - name: 2. Sediakan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 3. Sediakan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: 4. Aktifkan Android SDK dan lesen
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDK_MANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDK_MANAGER" || { echo '::error::sdkmanager tidak ditemui'; exit 1; }
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          set +o pipefail
          yes | "$SDK_MANAGER" --licenses
          status=$?
          set -o pipefail
          test "$status" -eq 0 || { echo '::error::Penerimaan lesen Android gagal'; exit 1; }
          "$SDK_MANAGER" --install 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - name: 5. Pasang pakej dan bina aplikasi
        run: |
          npm install --no-audit --no-fund
          npm run build
          npx cap add android
          npx cap sync android
      - name: 6. Tambah keizinan dan ikon Android
        run: python3 scripts/setup_android.py
      - name: 7. Hasilkan release APK unsigned
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace --console=plain
      - name: 8. Tandatangan APK (GitHub Secrets)
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for var in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "::error::GitHub Secret $var belum dimasukkan. Baca README > APK RELEASE."
              exit 1
            fi
          done
          UNSIGNED=android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$UNSIGNED" || { echo '::error::APK release unsigned tidak ditemui'; ls -lah android/app/build/outputs/apk/release; exit 1; }
          KEYSTORE="$RUNNER_TEMP/edunova-upload.jks"
          printf %s "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          ZIPALIGN="$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          "$ZIPALIGN" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/edunova-aligned.apk"
          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out edunova-2.0-release.apk \
            "$RUNNER_TEMP/edunova-aligned.apk"
          "$APKSIGNER" verify --verbose edunova-2.0-release.apk
      - name: 9. Muat naik APK release
        uses: actions/upload-artifact@v4
        with:
          name: EduNova-2.0-APK-Release
          path: edunova-2.0-release.apk
          if-no-files-found: error
          retention-days: 30
